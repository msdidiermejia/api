    alb.ingress.kubernetes.io/group.name: alb-interop-nonmonetary
    alb.ingress.kubernetes.io/healthcheck-path: /SrvAPIRegister/healthy
spec:
  ingressClassName: alb
  rules:
  - host: srvapiregisterqa.bancounion.com
    http:
      paths:
