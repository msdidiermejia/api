  namespace: qa-interop-ns
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/tags: Environment=qa,IteraProject=BANCO_UNION_11907_CLOUD_2024,Project=interoperabilidad
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/security-groups: sg-09e8ccd1fc64804ca
